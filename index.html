<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For You ❤️</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Custom -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="romantic-bg">
  <div class="container py-4 py-lg-5">

    <header class="text-center mb-4">
      <h1 class="title-glow mb-2">Hi, My Love ❤️</h1>
      <p class="lead text-soft mb-0" id="ldrQuote">
        Even with miles between us, our love has stayed strong for 3 years — and it’s only getting stronger.
      </p>
    </header>

    <!-- Distance Cards -->
    <section class="glass-card p-3 p-lg-4 mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label text-soft fw-semibold">Distance in km</label>
          <input id="km" class="form-control soft-input" readonly>
        </div>
        <div class="col-md-4">
          <label class="form-label text-soft fw-semibold">Distance in miles</label>
          <input id="miles" class="form-control soft-input" readonly>
        </div>
        <div class="col-md-4">
          <label class="form-label text-soft fw-semibold">Distance in nautical miles</label>
          <input id="nmi" class="form-control soft-input" readonly>
        </div>
      </div>
      <div class="mt-3 text-center">
        <span class="badge rounded-pill badge-soft px-3 py-2">
          Bogor, Indonesia ↔ Hobart, Tasmania
        </span>
      </div>
    </section>

    <!-- Map -->
    <section class="glass-card p-2 p-lg-3 mb-4">
      <div id="map" class="map-box"></div>
      <div class="px-2 pb-2 text-center">
        <small class="text-muted-soft">A little line… connecting us ❤️</small>
      </div>
    </section>

    <!-- Ask Section -->
    <section class="glass-card p-4 text-center">
      <h2 class="mb-2 title-glow">Will you be my Valentine?</h2>
      <p class="text-soft mb-4">
        No matter the distance, you’re my favorite place.
      </p>

      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a class="btn btn-love btn-lg px-4" href="love.html?answer=yes">Yes 💖</a>
        <a class="btn btn-outline-love btn-lg px-4" href="love.html?answer=no">No 😒</a>
      </div>
    </section>

    <footer class="text-center mt-4">
      <small class="text-muted-soft">Made with love — Nomaan</small>
    </footer>

  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App -->
  <script src="assets/js/main.js"></script>
</body>
</html>
